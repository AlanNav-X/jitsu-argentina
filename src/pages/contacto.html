<div class="caja contacto-grilla">
  <div class="directo">
    <h2>Hablá directo con cada sede</h2>
    <div class="directo-sede">
      <h3>Caballito</h3>
      <p>Sensei Richard Robinson. Lunes, miércoles y viernes.</p>
      <p class="numero">+54 11 3059-4142</p>
      <div class="redes">
        <a class="boton" href="{{WHATSAPP}}">Abrir WhatsApp</a>
        <a class="boton boton-linea" href="https://www.instagram.com/caballitojiujitsuclub/">Instagram</a>
      </div>
    </div>
    <div class="directo-sede">
      <h3>Ramos Mejía</h3>
      <p>Sensei José María Vaquer. Martes y jueves.</p>
      <p class="numero">+54 9 11 6378-1362</p>
      <div class="redes">
        <a class="boton" href="{{WHATSAPP_RAMOS}}">Abrir WhatsApp</a>
        <a class="boton boton-linea" href="https://www.instagram.com/haedojiujitsuclub/">Instagram</a>
        <a class="boton boton-linea" href="https://www.facebook.com/p/Haedo-Jiu-Jitsu-Club-100057642211295/">Facebook</a>
      </div>
    </div>
  </div>

  <form class="formulario" id="form-contacto">
    <h2>Dejanos un mensaje</h2>
    <p class="trampa" aria-hidden="true"><label for="c-sitio">No completar</label><input id="c-sitio" name="sitio" type="text" tabindex="-1" autocomplete="off"></p>
    <fieldset class="campo sede-opciones">
      <legend>¿A qué sede querés ir?</legend>
      <label><input type="radio" name="sede" id="c-sede-caballito" value="Caballito" checked> Caballito</label>
      <label><input type="radio" name="sede" id="c-sede-ramos" value="Ramos Mejía"> Ramos Mejía</label>
      <label><input type="radio" name="sede" id="c-sede-nose" value="Todavía no sé"> Todavía no sé</label>
    </fieldset>
    <div class="campo">
      <label for="c-nombre">Nombre</label>
      <input id="c-nombre" name="nombre" type="text" autocomplete="name" required>
    </div>
    <div class="campo">
      <label for="c-email">Email</label>
      <input id="c-email" name="email" type="email" autocomplete="email" required>
    </div>
    <div class="campo">
      <label for="c-mensaje">Mensaje</label>
      <textarea id="c-mensaje" name="mensaje" required></textarea>
    </div>
    <button class="boton" type="submit">Enviar mensaje</button>
    <p class="estado" id="form-estado" role="status" hidden></p>
  </form>
</div>
